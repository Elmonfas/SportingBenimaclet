<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escudo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="c3d"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function(){
    const canvas = document.getElementById('c3d');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(0, 0, 7);

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Luces ──────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const key = new THREE.DirectionalLight(0xfff5e0, 2.0);
    key.position.set(5, 8, 6);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xc8f0d0, 0.6);
    fill.position.set(-6, -2, 4);
    scene.add(fill);

    // Luz puntual dorada que se mueve — da reflejos dinámicos al anillo
    const goldLight = new THREE.PointLight(0xf0b429, 3.5, 18);
    goldLight.position.set(3, 3, 5);
    scene.add(goldLight);

    // Luz puntual verde suave por detrás
    const rimLight = new THREE.PointLight(0x016531, 1.2, 14);
    rimLight.position.set(-2, -2, -4);
    scene.add(rimLight);

    // ── Grupo principal ────────────────────────────────────────────
    const group = new THREE.Group();
    scene.add(group);

    // ── Disco del escudo ───────────────────────────────────────────
    const discGeo = new THREE.CylinderGeometry(1.9, 1.9, 0.18, 80);
    const discMat = new THREE.MeshPhysicalMaterial({
      color: 0x016531,
      metalness: 0.3,
      roughness: 0.4,
      clearcoat: 0.6,
      clearcoatRoughness: 0.2,
    });

    // Cara frontal con textura del escudo
    const loader = new THREE.TextureLoader();
    loader.load(
      'https://sportingbenimaclet.es/wp-content/uploads/2025/03/Escudo-OFICIAL-2-2.png',
      function(tex) {
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const frontMat = new THREE.MeshPhysicalMaterial({
          map: tex,
          transparent: true,
          metalness: 0.15,
          roughness: 0.35,
          clearcoat: 0.8,
          clearcoatRoughness: 0.1,
        });
        // Geometría plana para la cara frontal (encima del disco)
        const faceGeo = new THREE.CircleGeometry(1.82, 80);
        const face = new THREE.Mesh(faceGeo, frontMat);
        face.rotation.x = -Math.PI / 2;
        face.position.y = 0.10;
        group.add(face);
      }
    );

    const disc = new THREE.Mesh(discGeo, discMat);
    disc.rotation.x = Math.PI / 2;
    group.add(disc);

    // ── Anillo exterior dorado ─────────────────────────────────────
    const ringGeo = new THREE.TorusGeometry(1.97, 0.10, 24, 120);
    const ringMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4960f,
      metalness: 1.0,
      roughness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      envMapIntensity: 1.5,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    group.add(ring);

    // Anillo interior más fino, más brillante
    const ring2Geo = new THREE.TorusGeometry(1.85, 0.04, 16, 120);
    const ring2Mat = new THREE.MeshPhysicalMaterial({
      color: 0xf0b429,
      metalness: 1.0,
      roughness: 0.04,
    });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    group.add(ring2);

    // ── Halo / glow detrás del escudo ─────────────────────────────
    const glowGeo = new THREE.CircleGeometry(2.6, 80);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x016531,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.z = -0.3;
    group.add(glow);

    const glow2Geo = new THREE.CircleGeometry(3.2, 80);
    const glow2Mat = new THREE.MeshBasicMaterial({
      color: 0xf0b429,
      transparent: true,
      opacity: 0.05,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const glow2 = new THREE.Mesh(glow2Geo, glow2Mat);
    glow2.position.z = -0.5;
    group.add(glow2);

    // ── Seguimiento suave del ratón ────────────────────────────────
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    window.addEventListener('mousemove', e => {
      targetX = (e.clientX / window.innerWidth  - 0.5) *  0.5;
      targetY = (e.clientY / window.innerHeight - 0.5) * -0.4;
    });

    // Mensaje desde el iframe padre (parallax desde HeroSection)
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'mousemove') {
        targetX = e.data.x * 0.5;
        targetY = e.data.y * -0.4;
      }
    });

    // ── Animación ──────────────────────────────────────────────────
    let t = 0;
    (function loop() {
      requestAnimationFrame(loop);
      t += 0.008;

      // Interpolación suave hacia el ratón
      currentX += (targetX - currentX) * 0.04;
      currentY += (targetY - currentY) * 0.04;

      // Flotación vertical suave
      group.position.y = Math.sin(t * 0.7) * 0.12;

      // Tilt según ratón + respiración mínima
      group.rotation.y = currentX + Math.sin(t * 0.4) * 0.03;
      group.rotation.x = currentY + Math.sin(t * 0.5) * 0.02;

      // Luz dorada orbitando
      goldLight.position.x = Math.cos(t * 0.6) * 5;
      goldLight.position.y = Math.sin(t * 0.4) * 3;

      renderer.render(scene, camera);
    })();
  })();
  </script>
</body>
</html>
