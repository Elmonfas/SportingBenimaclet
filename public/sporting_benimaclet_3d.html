<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escudo 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="c3d"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function(){
    const canvas = document.getElementById('c3d');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    camera.position.set(0, 0, 7.5);

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Luces — solo luz clave + ambiente, sin efectos de card ───────
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));

    const key = new THREE.DirectionalLight(0xfff5e0, 1.8);
    key.position.set(4, 6, 8);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xc8f0d0, 0.4);
    fill.position.set(-5, -2, 3);
    scene.add(fill);

    // ── Grupo ────────────────────────────────────────────────────────
    const group = new THREE.Group();
    scene.add(group);

    const texLoader = new THREE.TextureLoader();
    texLoader.load('/images/escudo.png', function(tex) {
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.encoding   = THREE.sRGBEncoding;

      // Proporciones reales del PNG
      const img = tex.image;
      const ratio = img.naturalHeight / img.naturalWidth;
      const W = 3.68, H = 3.68 * ratio;

      // — Cara frontal: el escudo con su forma real (alphaTest corta el fondo) —
      const frontMat = new THREE.MeshStandardMaterial({
        map:         tex,
        transparent: true,
        alphaTest:   0.15,        // corta píxeles transparentes → forma del escudo
        metalness:   0.1,
        roughness:   0.45,
        side:        THREE.FrontSide,
      });
      const front = new THREE.Mesh(
        new THREE.PlaneGeometry(W, H),
        frontMat
      );
      front.position.z = 0.12;
      group.add(front);

      // — Capas de grosor: 8 planos ligeramente más pequeños y oscuros detrás —
      // Crean la ilusión de que el escudo tiene cuerpo/profundidad
      const depthLayers = 8;
      for (let i = 1; i <= depthLayers; i++) {
        const t = i / depthLayers;
        const scale = 1 - t * 0.012;         // casi igual de tamaño
        const darkness = 0.18 + t * 0.55;    // de verde medio a verde muy oscuro

        const layerMat = new THREE.MeshStandardMaterial({
          map:         tex,
          transparent: true,
          alphaTest:   0.15,
          color:       new THREE.Color(0, darkness * 0.35, darkness * 0.18),
          metalness:   0.3,
          roughness:   0.5,
        });
        const layer = new THREE.Mesh(
          new THREE.PlaneGeometry(W * scale, H * scale),
          layerMat
        );
        layer.position.z = 0.12 - i * 0.032;
        group.add(layer);
      }

      // — Capa trasera de cierre —
      const backMat = new THREE.MeshStandardMaterial({
        map:         tex,
        transparent: true,
        alphaTest:   0.15,
        color:       new THREE.Color(0, 0.08, 0.04),
        metalness:   0.2,
        roughness:   0.6,
        side:        THREE.BackSide,
      });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.985, H * 0.985), backMat);
      back.position.z = 0.12 - depthLayers * 0.032 - 0.01;
      group.add(back);
    });

    // ── Sombra de levitación — elipse debajo del escudo ─────────────
    const shadowGroup = new THREE.Group();
    scene.add(shadowGroup);

    // Varias capas concéntricas para simular el blur de la sombra
    const shadowLayers = [
      { r: 1.60, opacity: 0.10 },
      { r: 2.00, opacity: 0.06 },
      { r: 2.50, opacity: 0.03 },
      { r: 3.00, opacity: 0.01 },
    ];

    const shadowMeshes = shadowLayers.map(({ r, opacity }) => {
      const geo = new THREE.CircleGeometry(r, 80);
      // Aplanar en Y para que sea una elipse
      geo.scale(1, 0.28, 1);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity,
        depthWrite: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      shadowGroup.add(mesh);
      return mesh;
    });

    // Posición base de la sombra — debajo del escudo
    shadowGroup.position.y = -2.6;
    shadowGroup.position.z = -0.5;

    // ── Luz de shimmer — se mueve para crear destellos en el escudo ──
    const shimmer = new THREE.PointLight(0xfff0cc, 3.5, 10);
    shimmer.position.set(2, 2, 4);
    scene.add(shimmer);

    // ── Mouse ────────────────────────────────────────────────────────
    let mouseX = 0, mouseY = 0;
    let hasMoused = false;
    let mouseIdleTimer = null;

    function applyMouse(nx, ny) {
      mouseX = nx;
      mouseY = ny;
      hasMoused = true;
      clearTimeout(mouseIdleTimer);
      // Vuelve al modo auto después de 2.5s sin mover el ratón
      mouseIdleTimer = setTimeout(() => { hasMoused = false; }, 2500);
    }

    window.addEventListener('mousemove', e => {
      applyMouse(
        e.clientX / window.innerWidth  - 0.5,
        e.clientY / window.innerHeight - 0.5
      );
    });

    window.addEventListener('message', e => {
      if (e.data?.type === 'mousemove') applyMouse(e.data.x, e.data.y);
    });

    // ── Loop ─────────────────────────────────────────────────────────
    let t = 0;
    let currRotY = 0, currRotX = 0;

    (function loop() {
      requestAnimationFrame(loop);
      t += 0.007;

      // Flotación vertical — respiración lenta y suave
      const floatY = Math.sin(t * 0.55) * 0.14;
      group.position.y = floatY;

      // Sombra: cuando sube → más pequeña y transparente; cuando baja → más grande y oscura
      const shadowFactor = 1 - (floatY + 0.14) / 0.28 * 0.35; // 0.65–1.0
      shadowGroup.scale.set(shadowFactor, 1, shadowFactor);
      shadowMeshes.forEach((m, i) => {
        const baseOpacity = shadowLayers[i].opacity;
        m.material.opacity = baseOpacity * (0.5 + (1 - shadowFactor) * 0.8);
      });

      if (hasMoused) {
        // Modo interactivo: tilt hacia el cursor
        const targetY =  mouseX * 0.7;
        const targetX = -mouseY * 0.55;
        currRotY += (targetY - currRotY) * 0.06;
        currRotX += (targetX - currRotX) * 0.06;
      } else {
        // Modo automático: rotación natural en Y mostrando la profundidad
        // Va y viene suavemente — tipo péndulo lento
        const autoY = Math.sin(t * 0.28) * 0.45;   // ±26° aprox
        const autoX = Math.sin(t * 0.19) * 0.08;   // inclinación mínima en X
        currRotY += (autoY - currRotY) * 0.025;
        currRotX += (autoX - currRotX) * 0.025;
      }

      group.rotation.y = currRotY;
      group.rotation.x = currRotX;

      // Shimmer: orbita lentamente alrededor del escudo
      shimmer.position.x = Math.cos(t * 0.6) * 4.5;
      shimmer.position.y = Math.sin(t * 0.4) * 3.0 + group.position.y;
      shimmer.position.z = Math.sin(t * 0.3) * 1.5 + 4;
      // Intensidad pulsa levemente — parpadeo muy sutil
      shimmer.intensity = 3.2 + Math.sin(t * 1.8) * 0.4;

      renderer.render(scene, camera);
    })();
  })();
  </script>
</body>
</html>
